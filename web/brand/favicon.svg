<svg width="220" height="220" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shineBg" x1="0" y1="0" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA845"/>
      <stop offset="50%" stop-color="#FF8324"/>
      <stop offset="100%" stop-color="#E55307"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="50" y1="35" x2="170" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF0E3"/>
    </linearGradient>
    <linearGradient id="cutGrad" x1="85" y1="45" x2="185" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E140E" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2D1F16" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#802800" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="220" height="220" rx="54" fill="url(#shineBg)"/>
  <rect x="2" y="2" width="216" height="216" rx="52" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3"/>

  <!-- Main Shine & Cut Mark -->
  <g filter="url(#softShadow)">
    <!-- Primary 4-point Star (Shine) -->
    <path d="M102 36C102 70 120 88 154 88C120 88 102 106 102 140C102 106 84 88 50 88C84 88 102 70 102 36Z" fill="url(#starGrad)"/>

    <!-- Dynamic 45-degree Precision Cut Blade -->
    <path d="M72 136L158 50L168 60L82 146Z" fill="url(#cutGrad)"/>
    <path d="M75 137L159 53" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>

    <!-- Modern Video / Play notch -->
    <polygon points="98,80 98,96 112,88" fill="#FF8324"/>

    <!-- Secondary Satellite Sparkle (Upper Right) -->
    <path d="M165 125C165 140 172 147 187 147C172 147 165 154 165 169C165 154 158 147 143 147C158 147 165 140 165 125Z" fill="url(#starGrad)"/>

    <!-- Micro accent sparkle -->
    <circle cx="58" cy="152" r="4.5" fill="#FFFFFF"/>
  </g>
</svg>